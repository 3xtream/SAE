<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sistem Akuisisi English 1 Tahun — Master System v4.7</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="loading-overlay" id="loading">Memproses data ke Cloud Spreadsheet...</div>

  <div class="container">
    <!-- Login & Register Section (Dipastikan tersembunyi saat awal load) -->
    <div id="authSection" class="auth-wrapper" style="display:none">
      <div class="auth-toggle">
        <span id="tabLogin" class="active" onclick="switchAuth('login')">Masuk</span>
        <span id="tabRegister" onclick="switchAuth('register')">Daftar Member</span>
      </div>
      <div id="loginBox" class="auth-box active">
        <div class="input-group"><label class="input-label">Email</label><input type="email" id="loginEmail" required></div>
        <div class="input-group"><label class="input-label">Password</label><input type="password" id="loginPassword" required></div>
        <button class="btn" style="width:100%;margin-top:1rem" onclick="handleLogin()">Login</button>
      </div>
      <div id="registerBox" class="auth-box">
        <div class="input-group"><label class="input-label">Nama Lengkap</label><input type="text" id="regName" required></div>
        <div class="input-group"><label class="input-label">Email</label><input type="email" id="regEmail" required></div>
        <div class="input-group"><label class="input-label">Password</label><input type="password" id="regPassword" required></div>
        <button class="btn" style="width:100%;margin-top:1rem" onclick="handleRegister()">Daftar Sekarang</button>
      </div>
    </div>

    <!-- Main Application Wrapper -->
    <div id="mainApp" style="display:none">
      <div style="margin-bottom:1.5rem;display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:10px">
        <div>
          <h1 id="appTitle">📊 Sistem Akuisisi English — Master Tracker v4.7</h1>
          <p class="subtitle">SLA-Based (Krashen & Paul Nation) · Google Sheets Database</p>
        </div>
        <div style="display:flex;gap:8px;align-items:center">
          <button class="btn" style="background:#791F1F" onclick="handleLogout()">Logout 🚪</button>
        </div>
      </div>

      <!-- Navigation Bar -->
      <div class="nav">
        <button class="nav-btn active" id="btn-dashboard" onclick="navigateTo('dashboard')">📈 Dashboard</button>
        <button class="nav-btn" id="btn-tracking" onclick="navigateTo('tracking')">📝 Daily Tracking</button>
        <button class="nav-btn" id="btn-flashcard" onclick="navigateTo('flashcard')">🃏 Flashcard Review</button>
        <button class="nav-btn" id="btn-vocab-milestone" onclick="navigateTo('vocab-milestone')">🎯 Vocab Milestone</button>
        <button class="nav-btn" id="btn-vocab-list" onclick="navigateTo('vocab-list')">🔤 List Vocabularies</button>
        <button class="nav-btn" id="btn-reading" onclick="navigateTo('reading')">⚡ Reading Monitor</button>
        <button class="nav-btn sp-navbtn" id="btn-speaking-lab" onclick="navigateTo('speaking-lab')">🎙️ Speaking Lab</button>
        <button class="nav-btn" id="btn-theory" onclick="navigateTo('theory')">📖 Landasan Teori</button>
        <button class="nav-btn" id="btn-phase1" onclick="navigateTo('phase1')">Phase 1</button>
        <button class="nav-btn" id="btn-phase2" onclick="navigateTo('phase2')">Phase 2</button>
        <button class="nav-btn" id="btn-phase3" onclick="navigateTo('phase3')">Phase 3</button>
        <button class="nav-btn" id="btn-phase4" onclick="navigateTo('phase4')">Phase 4</button>
        <button class="nav-btn" id="btn-premium" onclick="navigateTo('premium')">🔒 Premium Content</button>
      </div>

      <!-- VIEWPORT KONTEN DINAMIS (Isi menu dimuat ke dalam kontainer ini) -->
      <div id="content-viewport"></div>

    </div>
  </div>

  <script src="script.js"></script>
</body>
</html>
