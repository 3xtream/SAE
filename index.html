<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Member & Tracking Acquisition</title>
  <!-- Tailwind CSS -->
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- Google Fonts & Icons -->
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://fonts.googleapis.com/icon?family=Material+Icons+Round">
  
  <style>
    body { 
      font-family: 'Plus Jakarta Sans', sans-serif; 
      -webkit-tap-highlight-color: transparent; 
    }
    .custom-shadow {
      box-shadow: 0 4px 20px -2px rgba(148, 163, 184, 0.12), 0 2px 8px -1px rgba(148, 163, 184, 0.08);
    }
    .glass-effect {
      background: rgba(255, 255, 255, 0.85);
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
    }
    /* Animasi fade in halus saat perpindahan halaman */
    .fade-in {
      animation: fadeIn 0.4s ease-out forwards;
    }
    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(8px); }
      to { opacity: 1; transform: translateY(0); }
    }
  </style>
</head>
<body class="bg-[#F8FAFC] text-[#1E293B] min-h-screen flex flex-col justify-between pb-24">

  <!-- TOP APP BAR -->
  <header class="glass-effect border-b border-slate-100 sticky top-0 z-50 px-5 py-4 flex justify-between items-center">
    <div class="flex items-center space-x-3">
      <div class="w-9 h-9 rounded-xl bg-blue-50 flex items-center justify-center">
        <span class="material-icons-round text-blue-600 text-xl">insights</span>
      </div>
      <div>
        <h1 class="text-sm font-bold tracking-tight text-slate-900">EngAcquisition</h1>
        <p class="text-[10px] text-slate-400 font-medium">System Version 4.7</p>
      </div>
    </div>
    <button id="logoutBtn" class="hidden text-slate-400 hover:text-red-500 w-9 h-9 rounded-xl hover:bg-slate-50 transition flex items-center justify-center">
      <span class="material-icons-round text-xl">logout</span>
    </button>
  </header>

  <!-- MAIN CONTAINER -->
  <main class="flex-1 max-w-md mx-auto w-full px-5 py-6">
    
    <!-- 1. LOGIN SCREEN -->
    <div id="loginScreen" class="bg-white rounded-2xl custom-shadow border border-slate-100 p-6 space-y-6 mt-4 fade-in">
      <div class="space-y-1">
        <h2 class="text-xl font-bold text-slate-900 tracking-tight">Selamat datang kembali</h2>
        <p class="text-xs text-slate-400">Silakan masuk untuk melanjutkan tracking belajar Anda.</p>
      </div>
      
      <form id="loginForm" class="space-y-4" onsubmit="handleLogin(event)">
        <div class="space-y-1.5">
          <label class="text-[11px] font-semibold text-slate-400 uppercase tracking-wider block">Email Administrator / Member</label>
          <input type="email" id="emailInput" required class="w-full px-4 py-3 rounded-xl border border-slate-200 focus:outline-none focus:border-blue-500 bg-slate-50/50 text-sm transition font-medium" placeholder="nama@email.com">
        </div>
        <div class="space-y-1.5">
          <label class="text-[11px] font-semibold text-slate-400 uppercase tracking-wider block">Password</label>
          <input type="password" id="passwordInput" required class="w-full px-4 py-3 rounded-xl border border-slate-200 focus:outline-none focus:border-blue-500 bg-slate-50/50 text-sm transition font-medium" placeholder="••••••••">
        </div>
        <button type="submit" id="loginSubmitBtn" class="w-full bg-blue-600 hover:bg-blue-700 text-white text-sm font-semibold py-3 rounded-xl shadow-md shadow-blue-200 transition transform active:scale-[0.98] flex justify-center items-center h-11">
          <span>Masuk ke Dashboard</span>
        </button>
      </form>
    </div>

    <!-- 2. MAIN DASHBOARD SCREEN -->
    <div id="dashboardScreen" class="hidden space-y-5 fade-in">
      
      <!-- Premium Progress Card -->
      <div class="bg-gradient-to-tr from-slate-900 via-indigo-950 to-slate-900 rounded-2xl p-5 text-white shadow-xl relative overflow-hidden">
        <div class="absolute -right-6 -bottom-6 text-white/5 pointer-events-none">
          <span class="material-icons-round text-[120px]">analytics</span>
        </div>
        <div class="relative z-10 space-y-4">
          <div>
            <p class="text-[10px] text-indigo-200 uppercase tracking-widest font-semibold opacity-80">Personal Progress Dashboard</p>
            <h3 id="userWelcome" class="text-lg font-bold mt-0.5 tracking-tight">-</h3>
          </div>
          <div class="grid grid-cols-2 gap-3 pt-1">
            <div class="bg-white/5 border border-white/10 rounded-xl p-3">
              <span class="text-[11px] text-slate-300 block font-medium">Total Vocab</span>
              <span id="vocabCount" class="text-lg font-bold block mt-0.5">0 <span class="text-xs font-normal text-slate-400">words</span></span>
            </div>
            <div class="bg-white/5 border border-white/10 rounded-xl p-3">
              <span class="text-[11px] text-slate-300 block font-medium">Avg Speed</span>
              <span id="avgWpm" class="text-lg font-bold block mt-0.5">0 <span class="text-xs font-normal text-slate-400">WPM</span></span>
            </div>
          </div>
        </div>
      </div>

      <!-- Form Input Harian -->
      <div class="bg-white rounded-2xl custom-shadow border border-slate-100 p-5 space-y-4">
        <div class="flex items-center space-x-2 pb-1 border-b border-slate-50">
          <span class="material-icons-round text-blue-500 text-lg">edit_note</span>
          <h4 class="font-bold text-sm text-slate-800 tracking-tight">Input Kinerja Harian</h4>
        </div>
        <form id="logForm" class="space-y-4" onsubmit="handleSaveLog(event)">
          <div class="grid grid-cols-2 gap-3">
            <div class="space-y-1">
              <label class="text-[11px] text-slate-400 font-medium">WPM (Words Per Minute)</label>
              <input type="number" id="wpmInput" required class="w-full px-3 py-2.5 rounded-xl border border-slate-200 bg-slate-50/50 text-sm font-semibold focus:outline-none focus:border-blue-500" placeholder="0">
            </div>
            <div class="space-y-1">
              <label class="text-[11px] text-slate-400 font-medium">Akurasi (%)</label>
              <input type="number" id="accuracyInput" min="0" max="100" required class="w-full px-3 py-2.5 rounded-xl border border-slate-200 bg-slate-50/50 text-sm font-semibold focus:outline-none focus:border-blue-500" placeholder="0">
            </div>
          </div>
          <button type="submit" id="logSubmitBtn" class="w-full bg-slate-900 hover:bg-slate-800 text-white text-xs font-semibold py-3 rounded-xl shadow-sm transition active:scale-[0.98] h-11">
            Simpan Catatan Hari Ini
          </button>
        </form>
      </div>

      <!-- Checklist Fase Belajar -->
      <div class="bg-white rounded-2xl custom-shadow border border-slate-100 p-5 space-y-4">
        <div class="flex items-center space-x-2 pb-1 border-b border-slate-50">
          <span class="material-icons-round text-indigo-500 text-lg">verified</span>
          <h4 class="font-bold text-sm text-slate-800 tracking-tight">Pencapaian Fase Belajar</h4>
        </div>
        <div class="space-y-2.5" id="checklistContainer">
          <!-- Diisi via JavaScript -->
        </div>
      </div>

    </div>

  </main>

  <!-- BOTTOM NAVIGATION BAR -->
  <nav id="bottomNav" class="hidden fixed bottom-0 left-0 right-0 glass-effect border-t border-slate-100 px-8 py-3 flex justify-around items-center z-50 max-w-md mx-auto rounded-t-2xl shadow-lg">
    <button onclick="switchTab('dashboard')" class="flex flex-col items-center space-y-1 text-blue-600 transition">
      <span class="material-icons-round text-2xl">space_dashboard</span>
      <span class="text-[10px] font-semibold tracking-wide">Dashboard</span>
    </button>
    <button onclick="openSpeakingLab()" class="flex flex-col items-center space-y-1 text-slate-400 hover:text-slate-600 transition">
      <span class="material-icons-round text-2xl">mic</span>
      <span class="text-[10px] font-semibold tracking-wide">Speaking Lab</span>
    </button>
  </nav>

  <!-- TOAST NOTIFICATION -->
  <div id="toast" class="fixed bottom-24 left-1/2 transform -translate-x-1/2 bg-slate-900/95 backdrop-blur-md text-white text-xs font-medium px-4 py-3 rounded-xl shadow-xl opacity-0 pointer-events-none transition-all duration-300 z-50 flex items-center space-x-2.5 min-w-[240px] justify-center">
    <span id="toastIcon" class="material-icons-round text-base text-emerald-400">check_circle</span>
    <span id="toastMessage">Sukses</span>
  </div>

  <!-- JAVASCRIPT LOGIC -->
  <script>
    const WEB_APP_URL = "PROSES_URL_GAS_ANDA_DISINI"; 
    let currentUserEmail = "";

    function showToast(message, isError = false) {
      const toast = document.getElementById('toast');
      const icon = document.getElementById('toastIcon');
      document.getElementById('toastMessage').innerText = message;
      
      icon.innerText = isError ? 'error_outline' : 'check_circle';
      icon.className = `material-icons-round text-base ${isError ? 'text-rose-400' : 'text-emerald-400'}`;
      
      toast.classList.remove('opacity-0', 'translate-y-2');
      toast.classList.add('opacity-100', '-translate-y-1');
      setTimeout(() => {
        toast.classList.remove('opacity-100', '-translate-y-1');
        toast.classList.add('opacity-0', 'translate-y-2');
      }, 2500);
    }

    function toggleLoading(buttonId, isLoading, defaultText) {
      const btn = document.getElementById(buttonId);
      if (isLoading) {
        btn.disabled = true;
        btn.innerHTML = `<svg class="animate-spin h-4 w-4 text-white" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24"><circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4"></circle><path class="opacity-75" fill="currentColor" d="M4 12a8 8 0 0113-7.25V4a1 1 0 112 0v3.5a1 1 0 01-1 1h-3.5a1 1 0 110-2h1.4A6.001 6.001 0 1020 12a1 1 0 112 0 8 8 0 01-20 0z"></path></svg>`;
      } else {
        btn.disabled = false;
        btn.innerHTML = defaultText;
      }
    }

    async function handleLogin(e) {
      e.preventDefault();
      toggleLoading('loginSubmitBtn', true, '');
      
      const email = document.getElementById('emailInput').value;
      const password = document.getElementById('passwordInput').value;

      try {
        const response = await fetch(WEB_APP_URL, {
          method: 'POST',
          body: new URLSearchParams({ action: 'login', email: email, password: password })
        });
        const data = await response.json();

        if (data.status === 'success') {
          currentUserEmail = email;
          showToast('Login berhasil');
          initDashboard();
        } else {
          showToast(data.message || 'Kredensial salah', true);
        }
      } catch (err) {
        showToast('Gagal terhubung ke server', true);
      } finally {
        toggleLoading('loginSubmitBtn', false, 'Masuk ke Dashboard');
      }
    }

    function initDashboard() {
      document.getElementById('loginScreen').classList.add('hidden');
      document.getElementById('dashboardScreen').classList.remove('hidden');
      document.getElementById('bottomNav').classList.remove('hidden');
      document.getElementById('logoutBtn').classList.remove('hidden');
      
      document.getElementById('userWelcome').innerText = currentUserEmail.split('@')[0];
      loadChecklistMock();
    }

    function loadChecklistMock() {
      const container = document.getElementById('checklistContainer');
      const phases = ['Fase 1: Pronunciation Basic', 'Fase 2: Fluency Building', 'Fase 3: Advanced Acquisition'];
      container.innerHTML = phases.map((phase, i) => `
        <label class="flex items-center justify-between p-3.5 bg-slate-50/70 rounded-xl border border-slate-100 active:bg-slate-100 transition cursor-pointer select-none">
          <span class="text-xs font-semibold text-slate-700">${phase}</span>
          <input type="checkbox" onchange="handleChecklistChange(${i}, this.checked)" class="w-5 h-5 rounded-lg text-blue-600 focus:ring-blue-500/20 border-slate-300 bg-white transition">
        </label>
      `).join('');
    }

    async function handleSaveLog(e) {
      e.preventDefault();
      toggleLoading('logSubmitBtn', true, '');

      const wpm = document.getElementById('wpmInput').value;
      const acc = document.getElementById('accuracyInput').value;

      try {
        const response = await fetch(WEB_APP_URL, {
          method: 'POST',
          body: new URLSearchParams({
            action: 'saveDailyLog',
            email: currentUserEmail,
            wpm: wpm,
            accuracy: acc
          })
        });
        const data = await response.json();
        if(data.status === 'success') {
          showToast('Data berhasil disimpan');
          document.getElementById('logForm').reset();
        } else {
          showToast(data.message, true);
        }
      } catch (err) {
        showToast('Gagal menyimpan data', true);
      } finally {
        toggleLoading('logSubmitBtn', false, 'Simpan Catatan Hari Ini');
      }
    }

    async function handleChecklistChange(index, isChecked) {
      showToast(`Memperbarui status fase...`);
    }

    function openSpeakingLab() {
      showToast('Membuka Speaking Lab...');
    }

    document.getElementById('logoutBtn').addEventListener('click', () => {
      location.reload();
    });
  </script>
</body>
</html>
