<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Sistem Akuisisi English 1 Tahun — Master System v4.7</title>
  
  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://fonts.googleapis.com/icon?family=Material+Icons+Round">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
  
  <link rel="stylesheet" href="style.css">

  <style>
    body { 
      font-family: 'Plus Jakarta Sans', sans-serif; 
      -webkit-tap-highlight-color: transparent; 
    }
    .custom-shadow {
      box-shadow: 0 4px 20px -2px rgba(148, 163, 184, 0.12), 0 2px 8px -1px rgba(148, 163, 184, 0.08);
    }
    .glass-effect {
      background: rgba(255, 255, 255, 0.85);
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
    }
    .fade-in {
      animation: fadeIn 0.4s ease-out forwards;
    }
    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(8px); }
      to { opacity: 1; transform: translateY(0); }
    }
  </style>
</head>
<body class="bg-[#F8FAFC] text-[#1E293B] min-h-screen flex flex-col justify-between pb-24">

  <div id="loading" class="fixed inset-0 bg-slate-900/60 backdrop-blur-sm z-[9999] flex flex-col items-center justify-center text-white font-semibold text-sm gap-3" style="display: none;">
    <svg class="animate-spin h-8 w-8 text-white" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24">
      <circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4"></circle>
      <path class="opacity-75" fill="currentColor" d="M4 12a8 8 0 0113-7.25V4a1 1 0 112 0v3.5a1 1 0 01-1 1h-3.5a1 1 0 110-2h1.4A6.001 6.001 0 1020 12a1 1 0 112 0 8 8 0 01-20 0z"></path>
    </svg>
    <span>Memproses data ke Cloud Spreadsheet...</span>
  </div>

  <header class="glass-effect border-b border-slate-100 sticky top-0 z-50 px-5 py-4 flex justify-between items-center max-w-md mx-auto w-full rounded-b-2xl shadow-sm">
    <div class="flex items-center space-x-3">
      <div class="w-9 h-9 rounded-xl bg-blue-50 flex items-center justify-center">
        <span class="material-icons-round text-blue-600 text-xl">insights</span>
      </div>
      <div>
        <h1 class="text-sm font-bold tracking-tight text-slate-900">EngAcquisition</h1>
        <p class="text-[10px] text-slate-400 font-medium">System Version 4.7</p>
      </div>
    </div>
    <button id="logoutBtn" onclick="logout()" class="text-slate-400 hover:text-red-500 w-9 h-9 rounded-xl hover:bg-slate-50 transition flex items-center justify-center" style="display: none;">
      <span class="material-icons-round text-xl">logout</span>
    </button>
  </header>

  <main class="flex-1 max-w-md mx-auto w-full px-5 py-4">
    
    <div id="authSection" class="bg-white rounded-2xl custom-shadow border border-slate-100 p-6 space-y-6 mt-2 fade-in" style="display: none;">
      <div class="flex border-b border-slate-100 pb-1">
        <button id="tabLogin" onclick="switchAuth('login')" class="flex-1 text-center pb-3 text-sm font-bold text-blue-600 border-b-2 border-blue-600 transition">Masuk</button>
        <button id="tabRegister" onclick="switchAuth('register')" class="flex-1 text-center pb-3 text-sm font-medium text-slate-400 transition">Daftar Member</button>
      </div>
      
      <form id="loginBox" class="space-y-4" onsubmit="event.preventDefault(); handleLogin();">
      <div class="space-y-1.5">
        <label class="text-[11px] font-semibold text-slate-400 uppercase tracking-wider block">Email</label>
        <input type="email" id="email" required class="w-full px-4 py-3 rounded-xl border border-slate-200 focus:outline-none focus:border-blue-500 bg-slate-50/50 text-sm font-medium transition" placeholder="nama@email.com">
      </div>
      <div class="space-y-1.5">
        <label class="text-[11px] font-semibold text-slate-400 uppercase tracking-wider block">Password</label>
        <input type="password" id="password" required class="w-full px-4 py-3 rounded-xl border border-slate-200 focus:outline-none focus:border-blue-500 bg-slate-50/50 text-sm font-medium transition" placeholder="••••••••">
      </div>
      <button type="submit" class="w-full bg-blue-600 hover:bg-blue-700 text-white text-sm font-semibold py-3 rounded-xl shadow-md shadow-blue-100 transition transform active:scale-[0.98] h-11">
        Masuk ke Dashboard
      </button>
    </form>

      <form id="registerBox" class="space-y-4" style="display: none;" onsubmit="event.preventDefault(); handleRegister();">
        <div class="space-y-1.5">
          <label class="text-[11px] font-semibold text-slate-400 uppercase tracking-wider block">Nama Lengkap</label>
          <input type="text" id="regName" required class="w-full px-4 py-3 rounded-xl border border-slate-200 focus:outline-none focus:border-blue-500 bg-slate-50/50 text-sm font-medium transition" placeholder="Nama Anda">
        </div>
        <div class="space-y-1.5">
          <label class="text-[11px] font-semibold text-slate-400 uppercase tracking-wider block">Email</label>
          <input type="email" id="regEmail" required class="w-full px-4 py-3 rounded-xl border border-slate-200 focus:outline-none focus:border-blue-500 bg-slate-50/50 text-sm font-medium transition" placeholder="nama@email.com">
        </div>
        <div class="space-y-1.5">
          <label class="text-[11px] font-semibold text-slate-400 uppercase tracking-wider block">Password Baru</label>
          <input type="password" id="regPassword" required class="w-full px-4 py-3 rounded-xl border border-slate-200 focus:outline-none focus:border-blue-500 bg-slate-50/50 text-sm font-medium transition" placeholder="••••••••">
        </div>
        <button type="submit" class="w-full bg-emerald-600 hover:bg-emerald-700 text-white text-sm font-semibold py-3 rounded-xl shadow-md transition transform active:scale-[0.98] h-11">
          Daftar Sekarang
        </button>
      </form>
    </div>

    <div id="mainDashboard" class="hidden space-y-5 fade-in">
      
      <div class="bg-gradient-to-tr from-slate-900 via-indigo-950 to-slate-900 rounded-2xl p-5 text-white shadow-xl relative overflow-hidden">
        <div class="relative z-10 space-y-4">
          <div>
            <p class="text-[10px] text-indigo-200 uppercase tracking-widest font-semibold opacity-80">Personal Progress Dashboard</p>
            <h3 id="userWelcome" class="text-lg font-bold mt-0.5 tracking-tight">Loading...</h3>
          </div>
          <div class="grid grid-cols-2 gap-3 pt-1">
            <div class="bg-white/5 border border-white/10 rounded-xl p-3">
              <span class="text-[11px] text-slate-300 block font-medium">Total Vocab Mastered</span>
              <span id="statVocabCount" class="text-lg font-bold block mt-0.5">0</span>
            </div>
            <div class="bg-white/5 border border-white/10 rounded-xl p-3">
              <span class="text-[11px] text-slate-300 block font-medium">Avg Speed</span>
              <span id="statAvgWpm" class="text-lg font-bold block mt-0.5">0 <span class="text-xs font-normal text-slate-400">WPM</span></span>
            </div>
          </div>
        </div>
      </div>

      <div id="dashboard-section" class="space-y-4">
         </div>
      
      <div id="phase1" class="section bg-white rounded-2xl custom-shadow border border-slate-100 p-5 space-y-3"></div>
      <div id="phase2" class="section bg-white rounded-2xl custom-shadow border border-slate-100 p-5 space-y-3"></div>
      <div id="phase3" class="section bg-white rounded-2xl custom-shadow border border-slate-100 p-5 space-y-3"></div>
      <div id="phase4" class="section bg-white rounded-2xl custom-shadow border border-slate-100 p-5 space-y-3"></div>

      <div id="premium-content-section" class="section hidden"></div>
    </div>

    <div id="speakingLabSection" class="hidden space-y-4 fade-in">
      <div class="bg-white rounded-2xl custom-shadow border border-slate-100 p-4 flex justify-between items-center">
        <div>
          <h4 class="font-bold text-sm text-slate-800">Speaking Lab Active Session</h4>
          <p class="text-xs text-slate-400">Terintegrasi otomatis</p>
        </div>
        <a id="spOpenTabBtn" target="_blank" class="bg-blue-50 text-blue-600 p-2.5 rounded-xl hover:bg-blue-100 transition flex items-center justify-center">
          <span class="material-icons-round text-lg">open_in_new</span>
        </a>
      </div>
      <div class="relative w-full h-[60vh] bg-white rounded-2xl custom-shadow border border-slate-100 overflow-hidden">
        <div id="spIframeLoader" class="absolute inset-0 flex items-center justify-center bg-white z-10 text-xs text-slate-400 font-medium">
           Loading secure container...
        </div>
        <iframe id="spLabIframe" class="w-full h-full border-0" style="display:none;"></iframe>
      </div>
    </div>

  </main>

  <nav id="bottomNav" class="fixed bottom-0 left-0 right-0 glass-effect border-t border-slate-100 px-8 py-3 flex justify-around items-center z-50 max-w-md mx-auto rounded-t-2xl shadow-lg" style="display: none;">
    <button id="nav-dashboard" onclick="switchSection('dashboard')" class="flex flex-col items-center space-y-1 text-blue-600 transition">
      <span class="material-icons-round text-2xl">space_dashboard</span>
      <span class="text-[10px] font-semibold tracking-wide">Dashboard</span>
    </button>
    <button id="nav-speaking-lab" onclick="switchSection('speaking-lab')" class="flex flex-col items-center space-y-1 text-slate-400 hover:text-slate-600 transition">
      <span class="material-icons-round text-2xl">mic</span>
      <span class="text-[10px] font-semibold tracking-wide">Speaking Lab</span>
    </button>
  </nav>

  <div id="toast" class="fixed bottom-24 left-1/2 transform -translate-x-1/2 bg-slate-900/95 backdrop-blur-md text-white text-xs font-medium px-4 py-3 rounded-xl shadow-xl opacity-0 pointer-events-none transition-all duration-300 z-[9999] flex items-center space-x-2.5 min-w-[240px] justify-center">
    <span id="toastIcon" class="material-icons-round text-base text-emerald-400">check_circle</span>
    <span id="toastMessage">Sukses</span>
  </div>

  <script src="script.js"></script>
</body>
</html>
