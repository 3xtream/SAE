<div class="section-title">Reading Speed & WPM Monitor</div>
<div class="card" style="background:#f4f7fa;border:1px solid #cbd5e1">
  <div style="font-size:13px;font-weight:bold;color:var(--color-primary);margin-bottom:6px">🧮 Kalkulator WPM Mandiri</div>
  <div class="three-col">
    <div class="input-group"><label class="input-label">Jumlah Kata Teks</label><input type="number" id="calcWords" value="150" oninput="runWpmCalc()"></div>
    <div class="input-group"><label class="input-label">Waktu Tempuh (Detik)</label><input type="number" id="calcSeconds" value="90" oninput="runWpmCalc()"></div>
    <div class="input-group"><label class="input-label" style="color:var(--color-primary)">Hasil Kalkulasi WPM</label><div id="calcResult" style="font-size:18px;font-weight:bold;padding-top:6px;color:var(--color-primary)">100 WPM</div></div>
  </div>
  <button class="btn" style="font-size:11px;padding:4px 10px;margin-top:8px" onclick="applyCalcToInput()">Gunakan Hasil ini Sebagai WPM</button>
</div>
<div class="card">
  <div class="input-group"><label class="input-label">Kecepatan Membaca Saat Ini (WPM)</label><input type="number" id="currentWpmInput" onchange="handleWpmChange()" value="0"></div>
  <div style="margin-top:1.5rem">
    <div style="font-size:12px;font-weight:bold;margin-bottom:10px;color:#555">VERIFIKASI TARGET MEMBACA PER FASE</div>
    <div style="margin-bottom:12px"><div style="display:flex;justify-content:space-between;font-size:12px;margin-bottom:4px"><span>Fase 1: 100 WPM</span><span id="wpmP1status"></span></div><div style="width:100%;height:6px;background:#eee;border-radius:3px"><div id="wpmP1bar" style="width:0%;height:100%;background:var(--text-phase-1);border-radius:3px"></div></div></div>
    <div style="margin-bottom:12px"><div style="display:flex;justify-content:space-between;font-size:12px;margin-bottom:4px"><span>Fase 2: 130 WPM</span><span id="wpmP2status"></span></div><div style="width:100%;height:6px;background:#eee;border-radius:3px"><div id="wpmP2bar" style="width:0%;height:100%;background:var(--text-phase-2);border-radius:3px"></div></div></div>
    <div style="margin-bottom:12px"><div style="display:flex;justify-content:space-between;font-size:12px;margin-bottom:4px"><span>Fase 3: 160 WPM</span><span id="wpmP3status"></span></div><div style="width:100%;height:6px;background:#eee;border-radius:3px"><div id="wpmP3bar" style="width:0%;height:100%;background:var(--text-phase-3);border-radius:3px"></div></div></div>
  </div>
</div>
