<div class="section-title">Daily Activity Input & Log</div>
<div class="card">
  <div class="three-col">
    <div class="input-group"><label class="input-label">Tanggal</label><input type="date" id="logDate"></div>
    <div class="input-group"><label class="input-label">Durasi Input (Menit)</label><input type="number" id="inputDuration" value="20"></div>
    <div class="input-group"><label class="input-label">Passage Dibaca</label><input type="number" id="passagesRead" value="1"></div>
  </div>
  <button class="btn" style="margin-top:0.5rem" onclick="logDailyActivity()">Simpan Log Harian</button>
</div>
