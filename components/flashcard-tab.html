<div class="section-title">🃏 Spaced Repetition Flashcard Review</div>
<div style="text-align:center;color:#666;margin-bottom:1rem" id="fcTracker">Memuat kartu peninjauan...</div>
<div class="flashcard-wrapper">
  <div class="flashcard" id="fCard" onclick="this.classList.toggle('flipped')">
    <div class="card-face card-front">
      <div class="fc-word" id="fcFrontWord">-</div>
      <button class="btn-speak" id="btnSpeak" onclick="speakCurrentWord(event)" title="Dengarkan pelafalan">🔊</button>
      <div class="fc-hint">Klik kartu untuk melihat arti</div>
    </div>
    <div class="card-face card-back">
      <div class="fc-meaning" id="fcBackMeaning">-</div>
      <div class="fc-hint">Klik kartu untuk melihat kata</div>
    </div>
  </div>
</div>
<div class="fc-controls">
  <button class="btn" style="background:#4b5563" onclick="prevCard(event)">⬅️ Sebelumnya</button>
  <button class="btn" style="background:#16a34a" onclick="markAsMasteredFromCard(event)">✅ Saya Sudah Hafal</button>
  <button class="btn" style="background:#0284c7" onclick="nextCard(event)">Berikutnya ➡️</button>
</div>
<div class="speech-controls">
  <div class="speech-row"><span class="speech-label">🔁 Auto-play saat ganti kartu</span><label class="toggle-switch"><input type="checkbox" id="autoPlayToggle"><span class="toggle-slider"></span></label></div>
  <div class="speech-row"><span class="speech-label">🐢 Kecepatan bicara</span><div class="speed-group"><button class="speed-btn active" onclick="setSpeed(0.7,this)">Lambat</button><button class="speed-btn" onclick="setSpeed(1.0,this)">Normal</button><button class="speed-btn" onclick="setSpeed(1.3,this)">Cepat</button></div></div>
  <div id="speechStatus" style="font-size:12px;color:#888;text-align:center;min-height:16px;margin-top:4px"></div>
</div>
